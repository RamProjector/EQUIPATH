name: EquiPath CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-quality:
    name: PHP syntax, smoke tests, and MySQL integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: equipath_eteeap
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none

      - name: Check PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t php_files < <(find web tests/php -type f -name '*.php' -print)
          test "${#php_files[@]}" -gt 0
          for file in "${php_files[@]}"; do
            php -l "$file"
          done

      - name: Run PHP smoke tests
        run: php tests/php/run.php

      - name: Check web JavaScript syntax
        run: |
          node --check web/assets/js/app.js
          node --check web/assets/js/applicant-applications.js
          node --check web/assets/js/screening.js
          node --check web/assets/js/evaluator-assignments.js
          node --check web/assets/js/rubric-configuration.js
          node --check web/assets/js/reports.js
          node --check web/assets/js/assessments.js
          node --check web/assets/js/credit-recommendations.js
          node --check web/assets/js/accreditation.js

      - name: Run document upload validation tests
        run: php tests/php/document_upload_validation.php

      - name: Run upload endpoint HTTP guard tests
        run: php tests/php/upload_endpoint_security.php

      - name: Run applicant application endpoint HTTP guard tests
        run: php tests/php/applicant_application_endpoint_security.php

      - name: Check database schema safety contract
        run: php tests/php/schema_contract.php

      - name: Check deployment security contract
        run: php tests/php/deployment_security_contract.php

      - name: Apply initial schema to clean MySQL service
        env:
          MYSQL_PWD: root
        run: mysql --host=127.0.0.1 --user=root equipath_eteeap < database/migrations/001_initial_schema.sql

      - name: Apply authentication rate-limit migration
        env:
          MYSQL_PWD: root
        run: mysql --host=127.0.0.1 --user=root equipath_eteeap < database/migrations/002_authentication_rate_limits.sql

      - name: Run database readiness endpoint integration tests
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: equipath_eteeap
        run: php tests/php/readiness_endpoint_integration.php

      - name: Run database integrity integration tests
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: equipath_eteeap
        run: php tests/php/database_integration.php

      - name: Run authentication integration tests
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: equipath_eteeap
        run: php tests/php/authentication_integration.php

      - name: Run authorization integration tests
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: equipath_eteeap
        run: php tests/php/authorization_integration.php

      - name: Run document download integration tests
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: equipath_eteeap
        run: php tests/php/document_download_integration.php

      - name: Run application draft integration tests
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: equipath_eteeap
        run: php tests/php/application_draft_integration.php

      - name: Run application submission integration tests
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: equipath_eteeap
        run: php tests/php/application_submission_integration.php

      - name: Run applicant history integration tests
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: equipath_eteeap
        run: php tests/php/application_history_integration.php

      - name: Run application screening integration tests
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: equipath_eteeap
        run: php tests/php/application_screening_integration.php

      - name: Run screening endpoint HTTP guard tests
        run: php tests/php/screening_endpoint_security.php

      - name: Run evaluator assignment integration tests
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: equipath_eteeap
        run: php tests/php/evaluator_assignment_integration.php

      - name: Run rubric configuration integration tests
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: equipath_eteeap
        run: php tests/php/rubric_configuration_integration.php

      - name: Run reporting integration tests
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: equipath_eteeap
        run: php tests/php/reporting_integration.php

      - name: Run evaluator assignment endpoint HTTP guard tests
        run: php tests/php/evaluator_assignment_endpoint_security.php

      - name: Run evaluator scoring integration tests
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: equipath_eteeap
        run: php tests/php/evaluator_scoring_integration.php

      - name: Run evaluator scoring endpoint HTTP guard tests
        run: php tests/php/evaluator_scoring_endpoint_security.php

      - name: Run evaluator scoring read endpoint HTTP guard tests
        run: php tests/php/evaluator_scoring_read_endpoints_security.php

      - name: Run assessment workflow integration tests
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: equipath_eteeap
        run: php tests/php/assessment_workflow_integration.php

      - name: Run assessment endpoint HTTP guard tests
        run: php tests/php/assessment_endpoint_security.php

      - name: Run credit recommendation integration tests
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: equipath_eteeap
        run: php tests/php/credit_recommendation_integration.php

      - name: Run credit recommendation endpoint HTTP guard tests
        run: php tests/php/credit_recommendation_endpoint_security.php

      - name: Run accreditation decision integration tests
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: equipath_eteeap
        run: php tests/php/accreditation_decision_integration.php

      - name: Run accreditation endpoint HTTP guard tests
        run: php tests/php/accreditation_endpoint_security.php

      - name: Run notification integration tests
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: equipath_eteeap
        run: php tests/php/notification_integration.php

      - name: Run notification endpoint HTTP guard tests
        run: php tests/php/notification_endpoint_security.php

      - name: Run session security tests
        run: php tests/php/session_security.php

      - name: Run login rate-limit integration tests
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: equipath_eteeap
          AUTH_RATE_LIMIT_SECRET: ci-only-test-secret-that-is-at-least-32-chars
        run: php tests/php/login_rate_limit_integration.php

  desktop-build:
    name: C# WinForms build
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build desktop client
        run: dotnet build desktop/EquiPath.Desktop.csproj --configuration Release
