name: EquiPath CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-quality:
    name: PHP syntax, smoke tests, and MySQL integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: equipath_eteeap
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none

      - name: Check PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t php_files < <(find web tests/php -type f -name '*.php' -print)
          test "${#php_files[@]}" -gt 0
          for file in "${php_files[@]}"; do
            php -l "$file"
          done

      - name: Run PHP smoke tests
        run: php tests/php/run.php

      - name: Check database schema safety contract
        run: php tests/php/schema_contract.php

      - name: Apply initial schema to clean MySQL service
        env:
          MYSQL_PWD: root
        run: mysql --host=127.0.0.1 --user=root equipath_eteeap < database/migrations/001_initial_schema.sql

      - name: Run database integrity integration tests
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: equipath_eteeap
        run: php tests/php/database_integration.php

  desktop-build:
    name: C# WinForms build
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build desktop client
        run: dotnet build desktop/EquiPath.Desktop.csproj --configuration Release
